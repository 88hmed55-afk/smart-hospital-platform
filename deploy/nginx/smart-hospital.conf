# Smart Hospital — LAN reverse proxy (Phase 6 / G6 reference configuration)
#
# Terminates TLS on the hospital LAN and forwards the SPA and the API to
# GlassFish. The notification stream needs three explicit settings, otherwise a
# proxy buffers Server-Sent Events and the client sees one delayed burst instead
# of live frames (ADR-006):
#
#   proxy_buffering off;          # never buffer the upstream body
#   proxy_read_timeout 1h;        # keep an idle stream open
#   proxy_set_header Connection ""; # do not force a hop-by-hop close
#
# The application also sends "X-Accel-Buffering: no" and
# "Cache-Control: no-cache, no-transform" on /api/v1/notifications/stream, so a
# deployment that misses this file still behaves correctly on Nginx.

upstream smart_hospital_api {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 443 ssl http2;
    server_name smart-hospital.local;

    ssl_certificate     /etc/nginx/tls/smart-hospital.crt;
    ssl_certificate_key /etc/nginx/tls/smart-hospital.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 20m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    # ---------------------------------------------------------------- API
    location /api/ {
        proxy_pass http://smart_hospital_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 120s;
    }

    # ------------------------------------------------- live notifications
    location = /api/v1/notifications/stream {
        proxy_pass http://smart_hospital_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 1h;
        gzip               off;
    }

    # ---------------------------------------------------------------- SPA
    location / {
        root  /opt/smart-hospital/web;
        index index.html;
        try_files $uri $uri/ /index.html;

        location ~* \.(?:js|css|woff2?|svg|png|jpg|ico)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }
    }
}

server {
    listen 80;
    server_name smart-hospital.local;
    return 301 https://$host$request_uri;
}
